memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_vars = 3000

; Помилки не виводяться відвідувачам (шляхи, SQL), а пишуться в лог.
; У режимі YII_ENV=dev Yii і так показує детальну сторінку помилки.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
expose_php = Off
