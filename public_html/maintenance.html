<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="30">
    <meta name="robots" content="noindex">
    <title>Оновлення сайту — 107 Sushi</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #0f1113;
            color: #fff;
            text-align: center;
        }
        .box { max-width: 420px; }
        .dot {
            width: 14px; height: 14px; margin: 0 auto 20px;
            border-radius: 50%; background: #dd4c2a;
            animation: pulse 1.4s ease-in-out infinite;
        }
        h1 { font-size: 1.5rem; margin: 0 0 8px; }
        p { margin: 0; color: rgba(255, 255, 255, 0.7); line-height: 1.5; }
        @keyframes pulse { 50% { transform: scale(1.6); opacity: 0.4; } }
    </style>
</head>
<body>
<div class="box">
    <div class="dot" aria-hidden="true"></div>
    <h1>Оновлюємо сайт</h1>
    <p>Це займе хвилину. Сторінка оновиться автоматично.</p>
</div>
</body>
</html>
